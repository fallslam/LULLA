<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Записать сон — Somno Sleep Tracker</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="header__container">
            <a href="index.html" class="logo">Somno<span>.</span></a>
            <nav class="nav">
                <a href="index.html" class="nav__link">Главная</a>
                <a href="log.html" class="nav__link active">Запись</a>
                <a href="stats.html" class="nav__link">Аналитика</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="screen">
            <div class="card">
                <h1 class="card__title">Записать сеанс сна</h1>
                <form class="sleep-form" action="index.html" method="GET">
                    <div class="form-group">
                        <label for="bedtime">Время отхода ко сну</label>
                        <input type="time" id="bedtime" class="form-control" value="23:00" required>
                    </div>
                    <div class="form-group">
                        <label for="waketime">Время пробуждения</label>
                        <input type="time" id="waketime" class="form-control" value="07:00" required>
                    </div>
                    <div class="form-group">
                        <label for="quality">Оценка самочувствия</label>
                        <select id="quality" class="form-control">
                            <option value="5">Отлично (Бодр)</option>
                            <option value="4">Хорошо</option>
                            <option value="3">Удовлетворительно</option>
                            <option value="2">Усталость</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn--secondary">Сохранить</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy; 2026 Somno Sleep Tracker. Все права защищены.</p>
    </footer>

</body>
</html>
