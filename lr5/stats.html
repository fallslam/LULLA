<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Аналитика — Somno Sleep Tracker</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="header__container">
            <a href="index.html" class="logo">Somno<span>.</span></a>
            <nav class="nav">
                <a href="index.html" class="nav__link">Главная</a>
                <a href="log.html" class="nav__link">Запись</a>
                <a href="stats.html" class="nav__link active">Аналитика</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="screen">
            <div class="card">
                <h1 class="card__title">Статистика за неделю</h1>
                <div class="stats-grid">
                    <div class="stats-item">
                        <span class="stats-item__label">Средний сон</span>
                        <span class="stats-item__value">7.5 ч</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-item__label">Регулярность</span>
                        <span class="stats-item__value">92%</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-item__label">Дефицит сна</span>
                        <span class="stats-item__value">1.2 ч</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy; 2026 Somno Sleep Tracker. Все права защищены.</p>
    </footer>

</body>
</html>
